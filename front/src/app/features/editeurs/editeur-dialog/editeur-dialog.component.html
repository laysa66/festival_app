<h2 mat-dialog-title>@if (isCreating()) { Ajouter un nouvel éditeur } @else { Modifier l'éditeur }</h2>
    <mat-dialog-content>
      <form [formGroup]="form">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="libelle">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Téléphone</mat-label>
          <input matInput formControlName="phone">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="4"></textarea>
        </mat-form-field>

        <div class="checkbox-group">
          <mat-checkbox formControlName="exposant">Exposant</mat-checkbox>
          <mat-checkbox formControlName="distributeur">Distributeur</mat-checkbox>
        </div>
      </form>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button (click)="onCancel()">Annuler</button>
      <button mat-raised-button color="primary" (click)="onSave()">@if (isCreating()) { Créer } @else { Sauvegarder }</button>
    </mat-dialog-actions>
  `
